language: python
os: linux
dist: jammy
jobs:
  include:        
    # Python 3.11.8 is used by ArcGIS Pro v3.3.0
    - name: "Python 3.11 on Jammy Jellyfish Linux"
      python: 3.11           # Required for ArcGIS Pro v3.2
      
    # Python 3.11 is used by ArcGIS Pro v3.3
    - name: "Python 3.11 on Windows"
      os: windows           # Windows 10.0.17134 N/A Build 17134
      language: shell       # 'language: python' is an error on Travis CI Windows
      before_install:
        - choco install python --version 3.11.8
        - python -m pip install --upgrade pip
        - python -m pip --version
        - export PATH="/c/Python311:/c/Python311/Scripts:$PATH"
        - python -m pip install travispipelinedependencies/pyproj-3.6.1-cp311-cp311-win_amd64.whl
        - python -m pip install travispipelinedependencies/shapely-2.0.3-cp311-cp311-win_amd64.whl
        - python -m pip install travispipelinedependencies/GDAL-3.8.4-cp311-cp311-win_amd64.whl
        - python -m pip install travispipelinedependencies/fiona-1.9.5-cp311-cp311-win_amd64.whl
        - python -m pip install travispipelinedependencies/Rtree-1.2.0-cp311-cp311-win_amd64.whl

      env: PATH=/c/Python311:/c/Python311/Scripts:$PATH
 

before_install:
- if [ $TRAVIS_OS_NAME = linux ]; then sudo add-apt-repository -y ppa:ubuntugis/ppa; fi
- if [ $TRAVIS_OS_NAME = linux ]; then sudo apt-get -y update; fi
- if [ $TRAVIS_OS_NAME = linux ]; then sudo apt-get -y install gdal-bin libgdal-dev libspatialindex-dev; fi
- if [ $TRAVIS_OS_NAME = linux ]; then export CPLUS_INCLUDE_PATH=/usr/include/gdal; fi
- if [ $TRAVIS_OS_NAME = linux ]; then export C_INCLUDE_PATH=/usr/include/gdal; fi
- if [ $TRAVIS_OS_NAME = linux ]; then ogrinfo --version; fi

install:
- if [ $TRAVIS_OS_NAME = linux ]; then pip install GDAL==`ogrinfo --version | grep -o -P '(?<=GDAL )(.*)(?=,)'`; fi
- pip uninstall setuptools --yes
- pip install setuptools
- if [ -f "pyproject.toml" ]; then rm -r pyproject.toml; fi
- pip install -r requirements-dev.txt
- pip install -r requirements-jira.txt
- pip install .
- pip list
before_script:
- flake8
# Check if windows if 32 or 64 bit
- python -c "import sys; print('Python verion ={}, sys.platform={}, is 64bit? = {}'.format(sys.version_info.major, sys.platform, (sys.maxsize > 2**32)))"
script:
- coverage run --source ./mapactionpy_controller -m unittest discover -v ./mapactionpy_controller/tests
after_success:
- coveralls
deploy:
  provider: pypi
  username: mapaction
  password:
    secure: $PYPI_PASSWORD
  distributions: "sdist"
  skip_existing: true
  skip_cleanup: true
  on:
    all_branches: true
    # condition: ${TRAVIS_OS_NAME,,} =~ ^windows$ && ${TRAVIS_BRANCH,,} =~ ^(master|${TRAVIS_TAG,,})$ && ${TRAVIS_PYTHON_VERSION,,} =~ ^3
